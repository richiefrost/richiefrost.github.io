<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/landing.css' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="name" href="{{ '/' | relative_url }}">Richie Frost</a>
      <nav>
        <a href="#help">Services</a>
        <a href="#pricing">Pricing</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a class="nav-cta" href="{{ site.booking_url }}">Book a call</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>&copy; {{ 'now' | date: '%Y' }} Richie Frost</span>
      <span class="footer-links">
        {% for link in site.author.links %}<a href="{{ link.url }}">{{ link.label }}</a>{% endfor %}
        <a href="{{ '/about/' | relative_url }}">About &amp; research</a>
      </span>
    </div>
  </footer>
</body>
</html>
